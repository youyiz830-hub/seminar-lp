name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: |
          DEPLOY_URL=$(npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          npx vercel alias set $DEPLOY_URL be-buddy-seminar.vercel.app --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
